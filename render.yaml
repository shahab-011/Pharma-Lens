services:
  - type: web
    name: pharmalens-backend
    env: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backendd.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: CORS_ORIGINS
        value: "*"

